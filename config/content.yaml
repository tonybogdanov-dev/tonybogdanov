about:
  headline: About me
  subline: My Story
  text:
    - >-
      My fascination with computers started early—exploring website source code in internet cafés before
      teaching myself HTML, CSS, JavaScript, PHP, and SQL.
    - >-
      By 2006, that curiosity had become commercial: a friend and I launched **flash4e.com**, a Flash game
      portal that generated advertising revenue. This led to working with the creators of **RumbleRace**,
      localizing the game for Bulgaria, maintaining its codebase, and operating its SMS payment platform.
    - >-
      While completing my Bachelor's degree in Computer Science in 2012, I joined my first in-house software
      engineering team, building on years of commercial development experience.
    - >-
      Since then I've worked across the entire stack—from user interfaces and APIs to cloud infrastructure.
      Today I primarily build with TypeScript, React, Node.js, and Kubernetes, while adapting to whatever
      technologies a project requires.
